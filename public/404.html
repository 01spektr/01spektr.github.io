<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <title>Страница не найдена — Toolboxi.uz</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light dark; font-family: Montserrat, Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #10213d; background: #f3f6fb; }
      main { width: min(520px, 100%); padding: 44px 32px; text-align: center; border: 1px solid #dce5f2; border-radius: 24px; background: #fff; box-shadow: 0 18px 55px rgb(31 73 125 / 10%); }
      img { width: 176px; max-width: 65%; }
      strong { display: block; margin: 28px 0 8px; color: #2878ed; font-size: clamp(54px, 12vw, 82px); line-height: 1; }
      h1 { margin: 0; font-size: clamp(22px, 5vw, 30px); }
      p { margin: 14px auto 26px; color: #64748b; line-height: 1.6; }
      a { display: inline-flex; min-height: 44px; align-items: center; padding: 0 20px; border-radius: 12px; color: #fff; background: #2878ed; font-weight: 700; text-decoration: none; }
      @media (prefers-color-scheme: dark) { body { color: #edf4ff; background: #0b1424; } main { border-color: #263b5a; background: #111d31; } p { color: #a7b8ce; } img { content: url('/toolboxi_uz_logo-dark.svg'); } }
    </style>
  </head>
  <body>
    <main>
      <img src="/toolboxi_uz_logo.svg" alt="Toolboxi.uz" />
      <strong>404</strong>
      <h1>Страница не найдена</h1>
      <p>Возможно, адрес изменился или в ссылке есть ошибка.</p>
      <a href="/">Перейти на главную</a>
    </main>
  </body>
</html>
